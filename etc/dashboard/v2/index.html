<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
        <link href="lib/weather-icons/css/weather-icons.min.css" rel="stylesheet">
        <link href="lib/materialdesign-icons/css/materialdesignicons.min.css" rel="stylesheet">
        <link href="lib/fullcalendar/main.css" rel="stylesheet">
        <link href="index.css" rel="stylesheet">
    </head>
    <body>
        <div class="container-fluid h-100">
            <div class="row h-35">
                <div class="col-5 align-self-center px-5">
                    <div class="row">
                        <div class="col" id="date">
                        </div>
                    </div>
                    <div class="row justify-content-center pt-2">
                        <div class="col-5" id="weather-current-temperature">
                        </div>
                        <div class="col-5 ps-2 ms-2" id="weather-current-icon">
                        </div>
                    </div>
                    <div class="row justify-content-center pt-2">
                        <div class="col text-center" id="weather-current-uv-index">
                        </div>
                    </div>
                    <div class="row align-items-center pt-5">
                        <div class="col-auto">
                            <span class="mdi mdi-washing-machine appliance-symbol p-0"></span>
                        </div>
                        <div class="col appliance-timer">
                            <div id="washing-machine-display">
                                Aus
                            </div>
                        </div>
                    </div>
                    <div class="row align-items-center pt-3">
                        <div class="col-auto">
                            <span class="mdi mdi-tumble-dryer appliance-symbol p-0"></span>
                        </div>
                        <div class="col appliance-timer">
                            <div id="dryer-display">
                                Aus
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-7 pt-2 text-center">
                    <img style="max-height:560px; max-width:100%; width:auto; border: 1px solid #000000; padding: 3px;" src="/api/v1/picture"/>
                </div>
            </div>
            <div class="row h-25">
                <div class="col-12">
                    <hr>
                    <div class="row">
                        <canvas id="temperature-chart"></canvas>
                    </div>
                    <div class="row p-2 pe-2 pt-1 pb-0" id="temperature-chart-images">
                    </div>
                    <div class="row ps-2 pe-2" id="temperature-chart-uv-index">
                    </div>
                    <div class="row ps-2 pe-2" id="temperature-chart-precipitation-probability">
                    </div>
                </div>
            </div>
            <div class="row h-40">
                <div class="col-12 pt-4">
                    <hr>
                    <div class="container">
                        <div class="row">
                            <div class="col" id="cal-col-1"></div>
                            <div class="col" id="cal-col-2"></div>
                            <div class="col" id="cal-col-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="lib/bootstrap/js/bootstrap.min.js"></script>
        <script src="lib/moment/moment-with-locales.min.js"></script>
        <script src="lib/chart/chart.min.js"></script>
        <script src="lib/chartjs-plugin-datalabels/chartjs-plugin-datalabels.min.js"></script>
        <script src="index.js"></script>
    </body>
</html>
